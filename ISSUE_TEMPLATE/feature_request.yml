name: Feature request
description: Suggest a feature, mechanic, or scenario for an astro-game-lab project.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! For larger proposals — a new game mode, a new subsystem, a whole game — consider opening a [Discussion](https://github.com/orgs/astro-game-lab/discussions) first so we can align on approach before anyone invests significant effort.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? What is the use case, or the experience you want to have?
      placeholder: I want to plan a transfer window without leaving the map view, but today I have to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you would like to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - Gameplay mechanic
        - Physics / simulation model
        - UI / UX / visualization
        - Scenario or level content
        - Art / audio
        - Performance
        - Tooling, build, or CI
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How broad is this change?
      options:
        - Small (single function, minor behavior tweak)
        - Medium (new module or noticeable behavior change)
        - Large (new subsystem, cross-cutting, or breaking change)
    validations:
      required: true

  - type: textarea
    id: fidelity
    attributes:
      label: Fidelity trade-off
      description: If this affects the simulation, does it trade physical accuracy for playability? Say so plainly — that is often the right call, but we want it to be a deliberate one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have considered, and why they were rejected.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, references, prior art, sketches, diagrams, or example APIs. Prior art from other space games is welcome and useful.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and discussions and this is not a duplicate.
          required: true
        - label: I have read the project's CONTRIBUTING.md.
          required: false
        - label: I agree to follow this project's Code of Conduct.
          required: true
